name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out bg3-ls at the tag commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: bg3-ls
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check out tree-sitter-bg3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: datwaft/tree-sitter-bg3
          ref: 9b0be2524bc147a7a057b6e559fe6889e80d3f7a # v0.7.2
          path: tree-sitter-bg3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable channel
      - name: Validate tag and main ancestry
        working-directory: bg3-ls
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != tag ]]; then
            echo "Release tag $RELEASE_TAG must be an annotated tag" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "Release tag $RELEASE_TAG does not resolve to event SHA $RELEASE_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Tag $RELEASE_TAG ($RELEASE_SHA) is not reachable from origin/main" >&2
            exit 1
          fi
      - name: Validate Cargo versions
        id: version
        working-directory: bg3-ls
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { in_section=1; next }
            /^\[/ { in_section=0 }
            in_section && $0 ~ /^version[[:space:]]*=/ {
              value=$0
              sub(/^[^=]*=[[:space:]]*/, "", value)
              gsub(/[[:space:]\"]/, "", value)
              print value
              exit
            }
          ' Cargo.toml)"
          if [[ "$workspace_version" != "$expected_version" ]]; then
            echo "Workspace version $workspace_version does not match $expected_version" >&2
            exit 1
          fi
          package_versions="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[].version' | sort -u)"
          if [[ "$package_versions" != "$expected_version" ]]; then
            echo "Workspace package versions do not match $expected_version:" >&2
            printf '%s\n' "$package_versions" >&2
            exit 1
          fi
          echo "version=$expected_version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify tagged commit
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.sha }}
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }}
    needs:
      - validate
      - verify
    if: needs.validate.result == 'success' && needs.verify.result == 'success'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out bg3-ls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: bg3-ls
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Check out tree-sitter-bg3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: datwaft/tree-sitter-bg3
          ref: 9b0be2524bc147a7a057b6e559fe6889e80d3f7a # v0.7.2
          path: tree-sitter-bg3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable channel
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: bg3-ls
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        working-directory: bg3-ls
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/bg3-ls" staging/
          cp README.md LICENSE staging/
          archive="bg3-ls-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C staging .
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bg3-ls-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            bg3-ls/bg3-ls-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            bg3-ls/bg3-ls-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish release
    needs:
      - validate
      - verify
      - build
    if: needs.validate.result == 'success' && needs.verify.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bg3-ls-${{ github.ref_name }}-*
          path: release
          merge-multiple: true
      - name: Validate release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_files=0
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            archive="release/bg3-ls-${RELEASE_TAG}-${target}.tar.gz"
            checksum="$archive.sha256"
            if [[ ! -f "$archive" || ! -f "$checksum" ]]; then
              echo "Missing release artifact for $target" >&2
              exit 1
            fi
            (cd "$(dirname "$checksum")" && shasum -a 256 -c "$(basename "$checksum")")
            expected_files=$((expected_files + 2))
          done
          actual_files="$(find release -type f | wc -l | tr -d ' ')"
          if [[ "$actual_files" -ne "$expected_files" ]]; then
            echo "Expected $expected_files release files, found $actual_files" >&2
            find release -type f -print >&2
            exit 1
          fi
      - name: Revalidate tag at publish time
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          tag_refs="$(git ls-remote "$REPOSITORY_URL" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_object="$(awk -v ref="refs/tags/$RELEASE_TAG" '$2 == ref { print $1 }' <<< "$tag_refs")"
          tag_commit="$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2 == ref { print $1 }' <<< "$tag_refs")"
          if [[ -z "$tag_object" || -z "$tag_commit" || "$tag_object" == "$tag_commit" || "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo "Tag $RELEASE_TAG no longer resolves to event SHA $RELEASE_SHA" >&2
            exit 1
          fi
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if existing_release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft 2>/dev/null)"; then
            existing_tag="$(jq -r '.tagName' <<< "$existing_release")"
            existing_draft="$(jq -r '.isDraft' <<< "$existing_release")"
            if [[ "$existing_tag" != "$RELEASE_TAG" ]]; then
              echo "Existing release tag $existing_tag does not match $RELEASE_TAG" >&2
              exit 1
            fi
            # Keep the existing generated notes and replace only the assets.
            gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
            if [[ "$existing_draft" == true ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            # Generate notes only on first creation; retries take the update path.
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
