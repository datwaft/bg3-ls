name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or commit to verify
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bg3-ls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: bg3-ls
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Check out tree-sitter-bg3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: datwaft/tree-sitter-bg3
          ref: 9b0be2524bc147a7a057b6e559fe6889e80d3f7a # v0.7.2
          path: tree-sitter-bg3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable channel
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bg3-ls
      - name: Check formatting
        working-directory: bg3-ls
        run: cargo fmt --all --check
      - name: Lint
        working-directory: bg3-ls
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: bg3-ls
        run: cargo test --workspace --locked
      - name: Check dependencies and licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: bg3-ls/Cargo.toml

  neovim:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bg3-ls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: bg3-ls
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Check out tree-sitter-bg3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: datwaft/tree-sitter-bg3
          ref: 9b0be2524bc147a7a057b6e559fe6889e80d3f7a # v0.7.2
          path: tree-sitter-bg3
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable channel
      - name: Install Neovim nightly
        run: |
          curl -L https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz -o nvim.tar.gz
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Test stdio protocol
        working-directory: bg3-ls
        run: make test-lsp
